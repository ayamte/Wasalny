server:  
  port: 8088  
  
spring:  
  datasource:  
    url: jdbc:postgresql://postgres-notification:5432/notification_db
    username: ${NOTIFICATION_DB_USER:wasalny_user}  
    password: ${NOTIFICATION_DB_PASSWORD}
  jpa:  
    hibernate:  
      ddl-auto: update  
    show-sql: true  
    properties:  
      hibernate:  
        dialect: org.hibernate.dialect.PostgreSQLDialect  
  rabbitmq:
    host: rabbitmq
    port: 5672
    username: ${RABBITMQ_USER:admin}
    password: ${RABBITMQ_PASSWORD}
  
eureka:
  client:
    service-url:
      defaultZone: http://eureka-server:8761/eureka/

security:
  jwt:
    secret-key: ${JWT_SECRET}