server:  
  port: 8082  
  
spring:  
  datasource:  
    url: jdbc:postgresql://postgres-paiement:5432/paiement_db
    username: ${PAYMENT_DB_USER:wasalny_user}
    password: ${PAYMENT_DB_PASSWORD}
  jpa:  
    hibernate:  
      ddl-auto: update  
    show-sql: true  
    properties:  
      hibernate:  
        dialect: org.hibernate.dialect.PostgreSQLDialect  
  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:redis}
      port: 6379
      password: ${SPRING_DATA_REDIS_PASSWORD}
  rabbitmq:
    host: rabbitmq
    port: 5672
    username: ${RABBITMQ_USER:admin}
    password: ${RABBITMQ_PASSWORD}
  
eureka:
  client:
    service-url:
      defaultZone: http://eureka-server:8761/eureka/

# JWT Configuration
security:
  jwt:
    secret-key: ${JWT_SECRET}
    expiration-time: ${JWT_EXPIRATION:3600000}