spring:  
  application:  
    name: api-gateway  
  config:  
    import: "configserver:${CONFIG_SERVER_URL:http://localhost:8888}"
  cloud:  
    config:  
      fail-fast: false  
      retry:  
        max-attempts: 20  
        initial-interval: 1000  
        max-interval: 2000  
  
server:  
  port: 8080